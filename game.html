<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>無人機術科模擬器 — ALIGN M460</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="game/game.css">
</head>
<body>
  <canvas id="c" aria-label="無人機術科模擬畫面"></canvas>

  <div id="menu-overlay" class="overlay">
    <div class="menu-container">
      <h1>🚁 無人機術科模擬器</h1>
      <p>ALIGN M460 · Mode 2 · 專業操作證練習</p>
      <div class="mode-cards">
        <button class="mode-card" data-mode="free"><span>🕹️</span><strong>自由練習</strong><small>自由飛行並切換三種視角</small></button>
        <button class="mode-card" data-mode="basic"><span>📚</span><strong>基本操作練習</strong><small>固定站位＋可切換俯視圖</small></button>
        <button class="mode-card" data-mode="exam"><span>🎯</span><strong>考試練習</strong><small>固定站位、無俯視輔助</small></button>
      </div>
      <p class="menu-hint">選擇練習模式開始</p>
    </div>
  </div>

  <div id="mission-complete" class="overlay" hidden>
    <div class="result-box">
      <h2 id="mc-title">任務完成！</h2>
      <div id="mc-score"></div>
      <div id="mc-breakdown"></div>
      <button id="restart-button" class="primary-button">重新開始</button>
      <button id="menu-button" class="secondary-button">返回選單</button>
    </div>
  </div>

  <div id="pause-overlay" class="overlay" hidden>
    <div class="pause-box"><h2>已暫停</h2><p>輸入已歸零，按下繼續後恢復練習。</p><button id="resume-button" class="primary-button">繼續</button></div>
  </div>

  <div id="hud">
    <header id="sb">
      <span>🛰️ <b>12</b> <small>GPS</small></span><i></i>
      <span>🔋 <b id="bat">100%</b></span><i></i>
      <span id="mode-badge">P-GPS</span><i></i>
      <span><small>H</small> <b id="hv">0.0</b><small>m</small></span>
      <span><small>D</small> <b id="dv">0</b><small>m</small></span>
      <span><small>↕</small> <b id="vsv">0.0</b><small>m/s</small></span>
      <span><small>→</small> <b id="hsv">0.0</b><small>m/s</small></span>
    </header>

    <a id="bk" href="index.html">← 返回</a>
    <div id="warns"></div>

    <section id="task-panel">
      <div id="task-header"><span id="task-num">1 / 1</span><strong id="task-title">起飛</strong><div id="task-timeout-bar"><div id="task-timeout-fill"></div></div></div>
      <p id="task-desc"></p><small id="task-check-desc"></small>
    </section>
    <div id="task-result" hidden></div>

    <div id="pip-frame" hidden><span>考場俯視</span></div>
    <button id="pip-toggle" hidden>俯視圖：開</button>

    <div id="hint"><h2>🚁 ALIGN M460</h2><p>請先選擇模式</p></div>

    <div id="flight-instruments">
      <div id="ahi-wrap">
        <svg viewBox="-45 -45 90 90" aria-label="姿態儀">
          <defs><clipPath id="ac"><circle cx="0" cy="0" r="43"/></clipPath></defs>
          <g clip-path="url(#ac)"><g id="aw"><rect x="-60" y="-100" width="120" height="100" fill="#1565c0"/><rect x="-60" y="0" width="120" height="100" fill="#7b4f2a"/><line x1="-60" y1="0" x2="60" y2="0" stroke="#fff"/></g></g>
          <line x1="-26" y1="0" x2="-8" y2="0" stroke="#facc15" stroke-width="2.2"/><line x1="8" y1="0" x2="26" y2="0" stroke="#facc15" stroke-width="2.2"/><circle cx="0" cy="0" r="2.8" fill="#facc15"/><circle id="roll-ind" cx="0" cy="-38" r="2.5" fill="#facc15"/><circle cx="0" cy="0" r="43" fill="none" stroke="rgba(255,255,255,.35)"/>
        </svg>
      </div>
      <div id="vsi"><span>↑</span><div><i id="vsi-bar"></i></div><span>↓</span></div>
      <div id="alt-disp"><b id="alt-val">0</b><small>m</small></div>
      <div id="cmp-wrap">
        <svg viewBox="-42 -42 84 84" aria-label="羅盤"><circle cx="0" cy="0" r="40" fill="rgba(0,0,0,.5)" stroke="rgba(255,255,255,.3)"/><g id="cd"><text x="0" y="-28">N</text><text x="28" y="0">E</text><text x="0" y="28">S</text><text x="-28" y="0">W</text></g><polygon points="0,-39 -4,-31 4,-31" fill="#fbbf24"/><text id="hdg-txt" x="0" y="3">000°</text></svg>
      </div>
    </div>

    <div id="vt"><button data-view="third" class="active">跟隨</button><button data-view="fpv">FPV</button><button data-view="top">俯視</button></div>
    <div id="act"><button id="ba">ARM</button><button id="br" disabled>RTH</button></div>
    <div class="joystick" id="jl"><div class="ring" id="jlr"><div class="thumb" id="jlt"></div></div><small>油門 / 偏航</small></div>
    <div class="joystick" id="jr"><div class="ring" id="jrr"><div class="thumb" id="jrt"></div></div><small>前後 / 左右</small></div>
    <div id="keyboard-hint">↑↓ 油門　←→ 偏航　|　WASD 前後左右　|　Space ARM　|　R RTH　|　V 視角</div>
  </div>

  <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
  <script type="module" src="game/app.mjs"></script>
</body>
</html>
